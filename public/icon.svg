<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cherishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#cherishGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="3" />

  <!-- Concierge Bell / Cloche Heart Arch -->
  <g transform="translate(256, 260) scale(0.72)">
    <!-- Heart shape -->
    <path d="M0 120 C-180 20 -240 -120 -120 -200 C-40 -250 0 -130 0 -130 C0 -130 40 -250 120 -200 C240 -120 180 20 0 120 Z" 
          fill="#ffffff" 
          filter="url(#glow)" />
          
    <!-- Center Spark / Diamond Ring star -->
    <path d="M0 -70 L14 -40 L44 -26 L14 -12 L0 18 L-14 -12 L-44 -26 L-14 -40 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="-26" r="6" fill="#ffffff" />
  </g>

  <!-- Sparkles -->
  <path d="M370 120 L378 138 L396 146 L378 154 L370 172 L362 154 L344 146 L362 138 Z" fill="url(#goldGrad)" opacity="0.9" />
  <path d="M130 360 L136 374 L150 380 L136 386 L130 400 L124 386 L110 380 L124 374 Z" fill="url(#goldGrad)" opacity="0.8" />
  <circle cx="390" cy="340" r="7" fill="#ffffff" opacity="0.8" />
  <circle cx="120" cy="160" r="6" fill="#ffffff" opacity="0.7" />
</svg>
